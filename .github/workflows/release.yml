# Makes a new version: picks the next number from the last v* tag, runs the tests, builds the
# installer and publishes a GitHub release with it attached. Started by hand in Actions › Release.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Part of the version to bump (major.minor.patch)"
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags decide the next version

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Next version
        id: version
        shell: pwsh
        run: |
          $last = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
          # Before the first release, the version in Directory.Build.props is the starting point.
          $current = if ($last) { [version]$last.TrimStart('v') } else { [version](dotnet msbuild src/Severino.App/Severino.App.csproj -getProperty:Version).Trim() }
          $next = switch ('${{ inputs.bump }}') {
            'major' { "$($current.Major + 1).0.0" }
            'minor' { "$($current.Major).$($current.Minor + 1).0" }
            default { "$($current.Major).$($current.Minor).$($current.Build + 1)" }
          }
          if (git tag --list "v$next") { throw "Tag v$next already exists." }
          "version=$next" >> $env:GITHUB_OUTPUT
          Write-Host "Last: $(if ($last) { $last } else { 'none' }) -> v$next"

      - name: Tests
        run: dotnet test -c Release

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $release = @("v$version", "artifacts/installer/Severino-Setup-$version.exe", '--target', $env:GITHUB_SHA, '--title', "Severino $version")
          # The notes are the version's section of the English CHANGELOG.md, with a link to the
          # Portuguese one; without a section, GitHub's generated notes.
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|^\[)")
          if ($section.Success -and $section.Groups[1].Value.Trim()) {
            $portuguese = "https://github.com/$env:GITHUB_REPOSITORY/blob/v$version/docs/pt-BR/CHANGELOG.md"
            ($section.Groups[1].Value.Trim() + "`n`n[Em português]($portuguese)") | Set-Content release-notes.md -Encoding utf8
            gh release create @release --notes-file release-notes.md
          } else {
            Write-Host "CHANGELOG.md has no [$version] section; using GitHub's generated notes."
            gh release create @release --generate-notes
          }
